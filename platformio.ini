[env]
framework = arduino
monitor_speed = 115200
upload_port = COM[13]

lib_deps = 
    fastled/FastLED
    paulstoffregen/OneWire
    avishorp/TM1637
    https://github.com/NorthernWidget/DS3231.git
    https://github.com/VAleSh-Soft/shButton.git
    https://github.com/VAleSh-Soft/shTaskManager.git
    https://github.com/VAleSh-Soft/shMAX72xxMini.git

; Сбалансированные флаги компилятора
build_flags =
  -Wall
  -Wextra
  -Wno-unused-parameter      ; Обязательно при -Wall/-Wextra для колбэков
  -Wno-unused-variable       ; Подавляет шум от неиспользуемых переменных в библиотеках
  -Wdouble-promotion         ; КРИТИЧНО для AVR: ловит неявное расширение float до double
  -Wundef
  -Wnull-dereference

; Убираем check_flags, так как --warnings-as-errors сломает проверку из-за библиотек
; check_flags = --warnings-as-errors 

[env:nanoatmega328new]
platform = atmelavr
board = nanoatmega328new

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328